<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>家族との連絡</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>👨‍👩‍👧 家族との連絡</h1>

    <div class="disaster-card">

        <h2>📋 家族の防災情報</h2>

        <p>
            災害が起きたときに確認できるよう、
            家族との連絡方法や集合場所を登録しておきましょう。
        </p>

        <div class="family-form">

            <label>
                📍 集合場所
                <input
                    type="text"
                    id="meeting-place"
                    placeholder="例：○○小学校">
            </label>

            <label>
                📞 家族の連絡先
                <input
                    type="text"
                    id="family-contact"
                    placeholder="例：家族の電話番号など">
            </label>

            <label>
                🏠 自宅の住所
                <input
                    type="text"
                    id="home-address"
                    placeholder="例：○○市○○町">
            </label>

            <label>
                📝 その他のメモ
                <textarea
                    id="family-memo"
                    placeholder="災害時に家族で決めておくことなど"></textarea>
            </label>

            <button id="save-family" class="save-button">
                💾 保存する
            </button>

            <p id="save-message" class="save-message"></p>

        </div>

    </div>

    <a href="index.html" class="back-button">
        ← ホームに戻る
    </a>

    <script>

        // 保存されている情報を読み込む
        document.getElementById("meeting-place").value =
            localStorage.getItem("meeting-place") || "";

        document.getElementById("family-contact").value =
            localStorage.getItem("family-contact") || "";

        document.getElementById("home-address").value =
            localStorage.getItem("home-address") || "";

        document.getElementById("family-memo").value =
            localStorage.getItem("family-memo") || "";


        // 保存ボタン
        document.getElementById("save-family").addEventListener("click", function () {

            localStorage.setItem(
                "meeting-place",
                document.getElementById("meeting-place").value
            );

            localStorage.setItem(
                "family-contact",
                document.getElementById("family-contact").value
            );

            localStorage.setItem(
                "home-address",
                document.getElementById("home-address").value
            );

            localStorage.setItem(
                "family-memo",
                document.getElementById("family-memo").value
            );

            document.getElementById("save-message").textContent =
                "✅ 保存しました！";

        });

    </script>

</body>

</html>
