<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>避難場所</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>🏃 避難場所</h1>

    <div class="disaster-card">

        <h2>📍 避難場所を確認</h2>


        <!-- 現在地から避難場所を探す -->
        <div class="nearby-shelter">
            <button type="button" id="find-nearby-button" class="map-button">
                📍 現在地から避難場所を探す
            </button>

            <p id="location-message">
                ボタンを押すと、現在地の利用許可を確認します。
            </p>
        </div>


        <a
            href="https://maps.gsi.go.jp/"
            target="_blank"
            class="map-button">
            🗺️ 避難場所を地図で確認
        </a>

        <p>
            災害が発生したときは、落ち着いて安全な場所へ避難しましょう。
        </p>

        <div class="map-container">
            <h3>🗺️ 防災地図</h3>

            <iframe
                src="https://maps.gsi.go.jp/"
                class="gsi-map"
                title="国土地理院の地図">
            </iframe>
        </div>

        <div class="shelter-list">

            <div class="shelter">
                <h3>🏫 学校</h3>
                <p>地域の指定避難所として利用されることがあります。</p>

                <a href="https://www.google.com/maps/search/避難所"
                    target="_blank"
                    class="map-button">
                        🗺️ 地図で確認
                </a>
            </div>

            <div class="shelter">
                <h3>🏢 公民館</h3>
                <p>地域の避難場所として利用される施設です。</p>

                <a href="https://www.google.com/maps/search/避難所"
                target="_blank"
                class="map-button">
                    🗺️ 地図で確認
                </a>
            </div>

            <div class="shelter">
                <h3>🏟️ 体育館</h3>
                <p>多くの人が避難できる施設です。</p>

                <a href="https://www.google.com/maps/search/避難所"
                target="_blank"
                class="map-button">
                    🗺️ 地図で確認
                </a>
            </div>

        </div>

    </div>

    <a href="index.html" class="back-button">
        ← ホームに戻る
    </a>

    <script src="script.js"></script>

</body>

</html>
