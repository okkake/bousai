<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>災害速報</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🚨 災害速報</h1>
        <p>最新の災害情報を確認できます</p>
    </header>

    

    <main>

        <!-- =========================
             地震情報
             ========================= -->

        <div class="disaster-card earthquake-card">

            <h2>🟥 地震</h2>

            <p>
                <strong>発生時刻：</strong>
                <span id="earthquake-time">---</span>
            </p>

            <p>
                <strong>震源地：</strong>
                <span id="earthquake-area">---</span>
            </p>

            <p>
                <strong>最大震度：</strong>
                <span id="earthquake-intensity">---</span>
            </p>

            <p>
                <strong>マグニチュード：</strong>
                <span id="earthquake-magnitude">---</span>
            </p>

            <div class="warning" id="earthquake-warning">
                情報を確認してください
            </div>

            <button id="update-button" class="update-button">
                🔄 最新情報を確認
            </button>

            <p id="update-time" class="update-time">
                最終確認：まだ確認していません
            </p>

        </div>


        <!-- =========================
             津波情報
             ========================= -->

        <div class="disaster-card tsunami-card">

            <h2>🌊 津波情報</h2>

            <p>
                <strong>発表状況：</strong>
                <span id="tsunami-status">確認中...</span>
            </p>

            <p>
                <strong>対象地域：</strong>
                <span id="tsunami-area">---</span>
            </p>

            <div class="warning" id="tsunami-warning">
                津波情報を確認しています
            </div>

        </div>


        <!-- =========================
             気象警報・注意報
             ========================= -->

        <div class="disaster-card weather-card">

            <h2>🌧️ 気象警報・注意報</h2>


            
            <div class="weather-level-legend">
                <div><span class="level-color level-5"></span>レベル5 特別警報</div>
                <div><span class="level-color level-4"></span>レベル4 危険警報</div>
                <div><span class="level-color level-3"></span>レベル3 警報</div>
                <div><span class="level-color level-2"></span>レベル2 注意報</div>
                <div><span class="level-color level-0"></span>発表なし</div>
            </div>



            <strong><label for="prefecture-select">都道府県：</label></strong>

            <select id="prefecture-select">
                <option value="">選択してください</option>
                <option value="北海道">北海道</option>
                <option value="青森県">青森県</option>
                <option value="岩手県">岩手県</option>
                <option value="宮城県">宮城県</option>
                <option value="秋田県">秋田県</option>
                <option value="山形県">山形県</option>
                <option value="福島県">福島県</option>
                <option value="茨城県">茨城県</option>
                <option value="栃木県">栃木県</option>
                <option value="群馬県">群馬県</option>
                <option value="埼玉県">埼玉県</option>
                <option value="千葉県">千葉県</option>
                <option value="東京都">東京都</option>
                <option value="神奈川県">神奈川県</option>
                <option value="新潟県">新潟県</option>
                <option value="富山県">富山県</option>
                <option value="石川県">石川県</option>
                <option value="福井県">福井県</option>
                <option value="山梨県">山梨県</option>
                <option value="長野県">長野県</option>
                <option value="岐阜県">岐阜県</option>
                <option value="静岡県">静岡県</option>
                <option value="愛知県">愛知県</option>
                <option value="三重県">三重県</option>
                <option value="滋賀県">滋賀県</option>
                <option value="京都府">京都府</option>
                <option value="大阪府">大阪府</option>
                <option value="兵庫県">兵庫県</option>
                <option value="奈良県">奈良県</option>
                <option value="和歌山県">和歌山県</option>
                <option value="鳥取県">鳥取県</option>
                <option value="島根県">島根県</option>
                <option value="岡山県">岡山県</option>
                <option value="広島県">広島県</option>
                <option value="山口県">山口県</option>
                <option value="徳島県">徳島県</option>
                <option value="香川県">香川県</option>
                <option value="愛媛県">愛媛県</option>
                <option value="高知県">高知県</option>
                <option value="福岡県">福岡県</option>
                <option value="佐賀県">佐賀県</option>
                <option value="長崎県">長崎県</option>
                <option value="熊本県">熊本県</option>
                <option value="大分県">大分県</option>
                <option value="宮崎県">宮崎県</option>
                <option value="鹿児島県">鹿児島県</option>
                <option value="沖縄県">沖縄県</option>
            </select>

            <p>
                <strong>発表状況：</strong>
                <span id="weather-status">確認中...</span>
            </p>

            <p>
                <strong>対象地域：</strong>
                <span id="weather-area">---</span>
            </p>

            <div class="warning" id="weather-warning">
                気象警報・注意報を確認しています
            </div>

            <div id="weather-details" class="weather-details"></div>

        </div>


        <!-- =========================
             ホームに戻る
             ========================= -->

        <button
            onclick="location.href='index.html'"
            class="back-button">

            ← ホームに戻る

        </button>

    </main>


    <script src="script.js"></script>

</body>

</html>
