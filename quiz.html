<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>防災クイズ</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>🧠 防災クイズ</h1>

    <div class="disaster-card">

        <h2>📚 防災について学ぼう！</h2>

        <p id="question">問題を読み込んでいます...</p>

        <div id="answers"></div>

        <p id="result"></p>

        <p id="score">0 / 4 問正解</p>

        <button id="next-button" class="save-button">
            次の問題 →
        </button>

    </div>

    <a href="index.html" class="back-button">
        ← ホームに戻る
    </a>


    <script>

        const questions = [

            {
                question: "地震が起きたとき、まずすることは？",
                answers: [
                    "外へ走って出る",
                    "身の安全を確保する",
                    "エレベーターに乗る"
                ],
                correct: 1
            },

            {
                question: "津波警報が発表されたら、どうする？",
                answers: [
                    "海を見に行く",
                    "海の近くで待つ",
                    "海や川から離れて安全な場所へ避難する"
                ],
                correct: 2
            },

            {
                question: "大雨のとき、危険な場所は？",
                answers: [
                    "川や水路の近く",
                    "安全な建物の中",
                    "高い場所"
                ],
                correct: 0
            },

            {
                question: "災害に備えて準備しておくとよいものは？",
                answers: [
                    "防災用品",
                    "使わないゲーム機だけ",
                    "何も準備しない"
                ],
                correct: 0
            }

        ];


        let currentQuestion = 0;
        let score = 0;
        let answered = false;


        function showQuestion() {

            answered = false;

            const question = questions[currentQuestion];

            document.getElementById("question").textContent =
                "第" + (currentQuestion + 1) + "問　" + question.question;

            document.getElementById("result").textContent = "";

            const answers =
                document.getElementById("answers");

            answers.innerHTML = "";


            question.answers.forEach((answer, index) => {

                const button =
                    document.createElement("button");

                button.textContent = answer;
                button.className = "quiz-answer";

                button.addEventListener("click", () => {
                    checkAnswer(index);
                });

                answers.appendChild(button);

            });

        }


        function checkAnswer(index) {

            if (answered) {
                return;
            }

            answered = true;

            const correct =
                questions[currentQuestion].correct;

            const result =
                document.getElementById("result");


            if (index === correct) {

                score++;

                result.textContent =
                    "⭕ 正解！";

            } else {

                result.textContent =
                    "❌ 不正解！";

            }


            document.getElementById("score").textContent =
                score + " / 4 問正解";

        }


        document.getElementById("next-button")
            .addEventListener("click", () => {

                if (!answered) {
                    return;
                }

                currentQuestion++;

                if (currentQuestion >= questions.length) {

                    document.getElementById("question").textContent =
                        "🎉 クイズ終了！";

                    document.getElementById("answers").innerHTML = "";

                    document.getElementById("result").textContent =
                        "あなたの得点は " + score + " / 4 問です！";

                    document.getElementById("next-button").style.display =
                        "none";

                    return;
                }

                showQuestion();

            });


        showQuestion();

    </script>

</body>

</html>
